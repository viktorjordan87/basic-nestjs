# Redis 6+ ACL: custom user and password
# Disable the default user so only our custom user can connect
user default off
# Create user 'redisuser' with password, access to all keys (~*) and all commands (+@all)
user redis_user on >redis_password ~* +@all

# Persistence: save to disk if at least 1 key changed in 20 seconds
save 20 1
# Log level: warning = only warnings and errors
loglevel warning
